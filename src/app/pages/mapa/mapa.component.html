<div class="page mapa-page">
  <div class="search-bar top">
    <span class="icon">🔍</span>
    <input
      type="text"
      placeholder="Buscar rota ou local"
      [(ngModel)]="termo"
      name="termo"
      (ngModelChange)="onBuscar()" />
  </div>

  <div class="lista-lateral desktop-only">
    @for (ponto of marcadores; track ponto.id) {
      <a class="card" [routerLink]="['/pontos', ponto.id]">
        <strong>{{ ponto.nome }}</strong>
        <p>{{ ponto.bairro }}</p>
      </a>
    }
  </div>

  <div class="map-wrap">
    <div #mapContainer class="leaflet-container-el"></div>
  </div>
</div>
