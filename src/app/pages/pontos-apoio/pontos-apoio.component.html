<div class="page pontos-page">
  <h2>Pontos de Apoio</h2>
  <p class="subtitle">Bicicletarias, oficinas e estacionamentos perto de você.</p>

  <div class="filtros">
    @for (f of filtros; track f.key) {
      <button
        class="chip"
        [class.active]="filtroAtivo() === f.key"
        (click)="selecionar(f.key)">
        {{ f.label }}
      </button>
    }
  </div>

  <div class="lista">
    @for (p of pontosFiltrados; track p.id) {
      <a class="ponto-card" [routerLink]="['/pontos', p.id]">
        <div class="thumb"></div>
        <div class="info">
          <strong>{{ p.nome }}</strong>
          <p>{{ p.bairro }} · {{ p.distanciaKm }} km</p>
          <span class="rating">★ {{ p.avaliacao }}</span>
        </div>
      </a>
    }
  </div>
</div>
