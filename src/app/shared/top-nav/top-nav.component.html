<header class="top-nav">
  <a routerLink="/inicio" class="brand">
     <img src="assets/img/logo-v2.png" alt="Logo Biciclo" style="width: 40px; height: auto;">
    <span class="brand-text">BICICLO<br><small>Floripa</small></span>
  </a>
  <nav class="links">
    @for (link of links; track link.path) {
      <a [routerLink]="link.path" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: link.path === '/inicio' }">
        {{ link.label }}
      </a>
    }
  </nav>
  <a routerLink="/mapa" class="btn-primary cta">Começar</a>
</header>
