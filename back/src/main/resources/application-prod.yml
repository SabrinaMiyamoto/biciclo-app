# Template de produção: todos os segredos devem vir de variáveis de ambiente.
# Nunca commitar valores reais neste arquivo.
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  firebase:
    service-account-path: ${FIREBASE_SERVICE_ACCOUNT_PATH:}

logging:
  level:
    root: INFO
    com.biciclo: INFO
